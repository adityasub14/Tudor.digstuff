<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUDOR — Produk & Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg1:#243e24;
    --bg2:#111711;
    --bg3:#891c1c;
    --accent:#eaf6ea;
    --accent2:#9c3636;
    --pink:#ac8195;
    --card:rgba(48, 33, 33, 0.06);
    --card-border:rgba(255,255,255,0.12);
    --text:#f3f1ff;
    --muted:#e1dfeb;
    font-family:'Poppins',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    color:var(--text);
    background: radial-gradient(circle at 20% 0%, var(--bg3), transparent 55%),
                radial-gradient(circle at 80% 10%, #577e5c, transparent 45%),
                linear-gradient(160deg, var(--bg1), var(--bg2) 55%, #0b0f2b);
    background-attachment: fixed;
    -webkit-font-smoothing:antialiased;
    padding-bottom:90px;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  .wrap{max-width:480px;margin:0 auto;position:relative;padding:0 16px;}

  /* ===== Header ===== */
  header.top{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(14px);
    background:rgba(88, 89, 95, 0.6);
    border-bottom:1px solid var(--card-border);
  }
  .top-inner{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    background:var(--card);border:1px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;
    color:var(--text);font-size:15px;position:relative;
    transition:.2s;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.14);transform:translateY(-1px);}
  .icon-btn:active{transform:scale(0.92);}
  .brand{
    font-family:'Sora',sans-serif;font-weight:800;font-size:20px;
    letter-spacing:.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    display:flex;flex-direction:column;align-items:center;line-height:1;
  }
  .brand small{font-size:9px;color:var(--muted);font-weight:500;letter-spacing:1.5px;-webkit-text-fill-color:var(--muted);}
  .badge{
    position:absolute;top:-4px;right:-4px;background:var(--pink);
    color:#1b0430;font-size:10px;font-weight:700;min-width:16px;height:16px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    padding:0 3px;
  }

  /* ===== Profile ===== */
  .profile{text-align:center;padding:28px 0 10px;}
  .avatar{
    width:92px;height:92px;border-radius:50%;object-fit:cover;
    border:3px solid var(--accent);box-shadow:0 0 0 6px rgba(34,224,200,0.12), 0 10px 30px rgba(0,0,0,0.4);
    margin-bottom:12px;
  }
  .profile h1{font-size:16px;font-family:'Sora',sans-serif;margin:0 0 4px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .profile h1 i{color:var(--accent);font-size:13px;}
  .profile p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;padding:0 12px;}
  .socials{display:flex;justify-content:center;gap:12px;margin:16px 0 4px;}
  .social-btn{
    width:42px;height:42px;border-radius:50%;
    background:var(--card);border:1px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;font-size:16px;
    transition:.25s;
  }
  .social-btn:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b0f2b;transform:translateY(-3px) rotate(-4deg);}

  /* ===== CTA links ===== */
  .cta-list{display:flex;flex-direction:column;gap:10px;margin:22px 0;}
  .cta{
    display:flex;align-items:center;gap:12px;padding:13px 16px;
    background:var(--card);border:1px solid var(--card-border);border-radius:14px;
    transition:.2s;position:relative;overflow:hidden;
  }
  .cta::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent, rgba(255,255,255,0.08), transparent);
    transform:translateX(-100%);transition:.5s;
  }
  .cta:hover::before{transform:translateX(100%);}
  .cta:hover{border-color:var(--accent);background:rgba(34,224,200,0.08);transform:translateY(-2px);}
  .cta:active{transform:scale(0.98);}
  .cta .ico{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b0f2b;
  }
  .cta span.txt{flex:1;font-size:13.5px;font-weight:600;text-align:left;}
  .cta i.chev{color:var(--muted);font-size:12px;}

  /* ===== Section titles ===== */
  .sec-title{
    font-family:'Sora',sans-serif;font-size:15px;font-weight:700;margin:26px 0 12px 2px;
    display:flex;align-items:center;gap:8px;
  }
  .sec-title i{color:var(--accent);}

  /* ===== Tabs ===== */
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:600;
    background:var(--card);border:1px solid var(--card-border);color:var(--muted);
    transition:.2s;white-space:nowrap;
  }
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b0f2b;border-color:transparent;}

  /* ===== Products grid ===== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{
    background:var(--card);border:1px solid var(--card-border);border-radius:16px;
    overflow:hidden;display:flex;flex-direction:column;transition:.25s;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 24px rgba(0,0,0,0.35);}
  .card .thumb{position:relative;width:100%;padding-top:75%;overflow:hidden;background:#1b1650;}
  .card .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .cat-badge{
    position:absolute;top:8px;left:8px;background:rgba(11,15,43,0.75);
    font-size:9.5px;padding:3px 8px;border-radius:20px;color:var(--accent);font-weight:700;
    border:1px solid rgba(34,224,200,0.4);
  }
  .quick-add{
    position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:50%;
    background:var(--accent);color:#0b0f2b;display:flex;align-items:center;justify-content:center;
    font-size:13px;border:none;box-shadow:0 4px 10px rgba(0,0,0,0.4);transition:.2s;
  }
  .quick-add:hover{background:var(--accent2);transform:scale(1.1);}
  .card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card .info h3{font-size:12.5px;margin:0;font-weight:600;line-height:1.35;min-height:34px;}
  .card .price{font-size:13px;font-weight:800;color:var(--accent);margin-top:2px;}
  .card .btn-detail{
    margin-top:6px;padding:7px 0;border-radius:9px;border:1px solid var(--card-border);
    background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;transition:.2s;
  }
  .card .btn-detail:hover{background:var(--accent);color:#0b0f2b;border-color:transparent;}

  /* ===== Floating report ===== */
  .fab-report{
    position:fixed;bottom:18px;left:18px;z-index:40;
    display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:30px;
    background:rgba(11,15,43,0.85);border:1px solid var(--card-border);
    font-size:12px;color:var(--muted);backdrop-filter:blur(10px);
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }
  .fab-report:hover{color:var(--text);border-color:var(--pink);}

  footer{text-align:center;padding:30px 0 10px;color:var(--muted);font-size:11.5px;}
  footer .heart{color:var(--pink);}

  /* ===== Overlay & Panels ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(3px);
    z-index:60;opacity:0;visibility:hidden;transition:.3s;
  }
  .overlay.show{opacity:1;visibility:visible;}

  .side-menu{
    position:fixed;top:0;left:0;height:100%;width:78%;max-width:300px;z-index:70;
    background:linear-gradient(180deg,#161049,#0b0f2b);
    border-right:1px solid var(--card-border);
    transform:translateX(-100%);transition:.35s cubic-bezier(.4,0,.2,1);
    padding:24px 20px;display:flex;flex-direction:column;gap:6px;
  }
  .side-menu.show{transform:translateX(0);}
  .side-menu h2{font-family:'Sora',sans-serif;font-size:18px;margin:0 0 18px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent;}
  .side-menu a{
    padding:12px 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);
    display:flex;align-items:center;gap:12px;transition:.2s;
  }
  .side-menu a:hover, .side-menu a.active{background:rgba(255,255,255,0.08);color:var(--text);}
  .side-menu a i{width:18px;color:var(--accent);}
  .close-btn{position:absolute;top:16px;right:16px;}

  .cart-drawer{
    position:fixed;top:0;right:0;height:100%;width:88%;max-width:340px;z-index:70;
    background:linear-gradient(180deg,#161049,#0b0f2b);
    border-left:1px solid var(--card-border);
    transform:translateX(100%);transition:.35s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  .cart-drawer.show{transform:translateX(0);}
  .cart-head{display:flex;align-items:center;justify-content:space-between;padding:20px 18px;border-bottom:1px solid var(--card-border);}
  .cart-head h2{font-family:'Sora',sans-serif;font-size:16px;margin:0;}
  .cart-items{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px;}
  .cart-empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px;}
  .cart-item{display:flex;gap:10px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:8px;}
  .cart-item img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .cart-item .ci-info{flex:1;min-width:0;}
  .cart-item .ci-info h4{font-size:12px;margin:0 0 4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cart-item .ci-price{font-size:12px;color:var(--accent);font-weight:700;}
  .qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:4px;}
  .qty-ctrl button{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,0.1);border:none;color:var(--text);font-size:11px;}
  .qty-ctrl span{font-size:12px;min-width:14px;text-align:center;}
  .remove-item{margin-left:auto;color:var(--pink);font-size:14px;background:none;border:none;align-self:flex-start;}
  .cart-foot{padding:16px 18px 20px;border-top:1px solid var(--card-border);}
  .cart-total{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:12px;}
  .cart-total span:last-child{color:var(--accent);}
  .checkout-btn{
    width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b0f2b;transition:.2s;
  }
  .checkout-btn:hover{filter:brightness(1.1);}
  .checkout-btn:active{transform:scale(0.97);}

  .modal{
    position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:.25s;padding:16px;
  }
  .modal.show{opacity:1;visibility:visible;}
  .modal-box{
    background:linear-gradient(180deg,#1b1650,#0b0f2b);border:1px solid var(--card-border);
    border-radius:20px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;
    transform:translateY(20px) scale(0.97);transition:.3s;position:relative;
  }
  .modal.show .modal-box{transform:translateY(0) scale(1);}
  .modal-close{position:absolute;top:12px;right:12px;z-index:5;}
  .modal-img{width:100%;height:190px;object-fit:cover;}
  .modal-body{padding:18px 20px 22px;}
  .modal-body h2{font-family:'Sora',sans-serif;font-size:17px;margin:0 0 6px;}
  .modal-cat{display:inline-block;font-size:10.5px;color:var(--accent);border:1px solid rgba(34,224,200,0.4);padding:3px 10px;border-radius:20px;margin-bottom:10px;}
  .modal-body p.desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
  .modal-price{font-size:20px;font-weight:800;color:var(--accent);margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;}
  .btn-outline, .btn-solid{
    flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;transition:.2s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-outline{background:transparent;border:1.5px solid var(--card-border);color:var(--text);}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent);}
  .btn-solid{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#0b0f2b;}
  .btn-solid:hover{filter:brightness(1.1);}

  .search-box{padding:18px;}
  .search-input-wrap{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px 14px;margin-bottom:16px;}
  .search-input-wrap input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;}
  .search-input-wrap i{color:var(--muted);}
  .search-results{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;}
  .search-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;transition:.2s;}
  .search-item:hover{background:rgba(255,255,255,0.06);}
  .search-item img{width:44px;height:44px;border-radius:8px;object-fit:cover;}
  .search-item h4{font-size:12.5px;margin:0 0 2px;font-weight:600;}
  .search-item span{font-size:11.5px;color:var(--accent);font-weight:700;}
  .no-result{text-align:center;color:var(--muted);font-size:13px;padding:20px;}

  .report-form label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  .report-form select, .report-form textarea, .report-form input{
    width:100%;background:var(--card);border:1px solid var(--card-border);border-radius:10px;
    color:var(--text);padding:10px 12px;font-size:13px;margin-bottom:14px;font-family:inherit;outline:none;
    transition:.2s;
  }
  .report-form select:focus, .report-form textarea:focus, .report-form input:focus{border-color:var(--accent);}
  .report-form textarea{resize:vertical;min-height:80px;}

  .toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:90%;max-width:360px;}
  .toast{
    background:rgba(20,15,55,0.95);border:1px solid var(--card-border);color:var(--text);
    padding:12px 16px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);animation:slideDown .3s ease, fadeOut .3s ease 2.4s forwards;
  }
  .toast i{color:var(--accent);}
  @keyframes slideDown{from{opacity:0;transform:translateY(-15px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeOut{to{opacity:0;transform:translateY(-10px);}}

  @media (min-width:600px){
    .wrap{max-width:560px;}
    .grid{grid-template-columns:repeat(3,1fr);}
  }

  /* ===== Testimonials ===== */
  .testi-scroll{
    display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;
    scroll-snap-type:x mandatory;scrollbar-width:none;
  }
  .testi-scroll::-webkit-scrollbar{display:none;}
  .testi-card{
    flex:0 0 82%;scroll-snap-align:start;
    background:var(--card);border:1px solid var(--card-border);border-radius:16px;
    padding:16px;display:flex;flex-direction:column;gap:10px;transition:.25s;
  }
  .testi-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .testi-top{display:flex;align-items:center;gap:10px;}
  .testi-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0;}
  .testi-name{font-size:13px;font-weight:700;line-height:1.3;}
  .testi-name small{display:block;font-size:11px;color:var(--muted);font-weight:500;}
  .testi-stars{color:#ffc245;font-size:11px;letter-spacing:2px;}
  .testi-text{font-size:12.5px;color:var(--muted);line-height:1.6;}

  @media (min-width:600px){
    .testi-card{flex-basis:47%;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <button class="icon-btn" id="menuBtn" title="Menu"><i class="fa-solid fa-bars"></i></button>
    <div class="brand">TUDOR<small>DIG.STUFF</small></div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" id="searchBtn" title="Cari"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn" id="cartBtn" title="Keranjang">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="badge" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="profile">
    <img class="avatar" src="fotoig.jpeg" alt="avatar">
    <h1>@adityasub14 <i class="fa-solid fa-circle-check"></i></h1>
    <p>Link & Product — Social Media Tools<br>
      Toko Palu Gada</p>
    <div class="socials">
      <a class="social-btn" href="https://tiktok.com" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
      <a class="social-btn" href="https://www.instagram.com/adityasub14?stkn=MW5tMGc0Z2h2NjZpYg==" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </section>

  <div class="cta-list">
    <div class="cta" onclick="openLink('https://wa.me/6282125017327','Kerja Sama')">
      <div class="ico"><i class="fa-solid fa-handshake"></i></div>
      <span class="txt">Kerja Sama — Collab</span>
      <i class="fa-solid fa-chevron-right chev"></i>
    </div>
    <div class="cta" onclick="openLink('https://www.gunungkebun.com','Web Gunungkebun.com')">
      <div class="ico"><i class="fa-solid fa-globe"></i></div>
      <span class="txt">Web Gunungkebun.com</span>
      <i class="fa-solid fa-chevron-right chev"></i>
    </div>
  </div>

  <div class="sec-title"><i class="fa-solid fa-layer-group"></i> Katalog</div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all">Semua</button>
    <button class="tab" data-cat="template">Template</button>    
  </div>

  <div class="grid" id="productGrid"></div>

  <h2 class="sec-title"><i class=></i>Review</h2>
  <div class="testi-scroll" id="testiScroll"></div>

  <footer>
    All Right Reserved | Adityasub © 2026
  </footer>
</div>

<button class="fab-report" id="reportBtn"><i class="fa-solid fa-flag"></i> Report</button>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- Side menu -->
<nav class="side-menu" id="sideMenu">
  <button class="icon-btn close-btn" id="closeMenu"><i class="fa-solid fa-xmark"></i></button>
  <h2>Menu</h2>
  <a href="#" class="active"><i class="fa-solid fa-house"></i> Home</a>
  <a href="#" onclick="scrollToProducts()"><i class="fa-solid fa-box"></i> Produk</a>
  <a href="#" onclick="openLink('https://wa.me/6282125017327','Kontak')"><i class="fa-solid fa-comment-dots"></i> Kontak</a>
  <a href="#" onclick="openReport()"><i class="fa-solid fa-flag"></i> Laporkan Masalah</a>
</nav>

<!-- Cart Drawer -->
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <h2>Keranjang Saya</h2>
    <button class="icon-btn" id="closeCart"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-total"><span>Total</span><span id="cartTotal">Rp 0</span></div>
    <button class="checkout-btn" id="checkoutBtn">Checkout via WhatsApp</button>
  </div>
</aside>

<!-- Product Modal -->
<div class="modal" id="productModal">
  <div class="modal-box" id="productModalBox"></div>
</div>

<!-- Search Modal -->
<div class="modal" id="searchModal">
  <div class="modal-box">
    <button class="icon-btn modal-close" id="closeSearch"><i class="fa-solid fa-xmark"></i></button>
    <div class="search-box">
      <div class="search-input-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Cari produk...">
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</div>

<!-- Report Modal -->
<div class="modal" id="reportModal">
  <div class="modal-box">
    <button class="icon-btn modal-close" id="closeReport"><i class="fa-solid fa-xmark"></i></button>
    <div class="search-box">
      <h2 style="font-family:'Sora',sans-serif;font-size:16px;margin-bottom:16px;">Laporkan Masalah</h2>
      <form class="report-form" id="reportForm">
        <label>Kategori</label>
        <select required>
          <option value="">Pilih kategori</option>
          <option>Link tidak berfungsi</option>
          <option>Produk bermasalah</option>
          <option>Penipuan / Scam</option>
          <option>Lainnya</option>
        </select>
        <label>Deskripsi</label>
        <textarea placeholder="Jelaskan masalah kamu..." required></textarea>
        <button type="submit" class="btn-solid" style="width:100%;">Kirim Laporan</button>
      </form>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ===================== DATA ===================== */
const PRODUCTS = [
  {id:4,cat:'ai',title:'On Progress',price:500,img:'inprogres.jpeg',desc:'Available in 3 days'},
  {id:13,cat:'template',title:'On Progress',price:500,img:'inprogres.jpeg',desc:'Available in 3 days siap edit untuk berbagai kebutuhan.',free:true},
  {id:14,cat:'bundle',title:'On Progress',price:500,img:'inprogres.jpeg',desc:'Available in 3 days'}
];

const fmt = n => n===0 ? 'Gratis' : 'Rp ' + n.toLocaleString('id-ID');

/* ===================== TESTIMONIALS (ganti dengan testimoni asli kamu) ===================== */
const TESTIMONIALS = [
  {name:'Iis', role:'-', avatar:'inprogres.jpeg', rating:5, text:'||'},
  {name:'Wanda', role:'-', avatar:'inprogres.jpeg', rating:5, text:'||'},
  {name:'Chiki', role:'-', avatar:'https://i.pravatar.cc/80?img=51', rating:4, text:'||'}
];
function renderTestimonials(){
  const el = document.getElementById('testiScroll');
  if(!el) return;
  el.innerHTML = TESTIMONIALS.map(t=>`
    <div class="testi-card">
      <div class="testi-top">
        <img class="testi-avatar" src="${t.avatar}" alt="${t.name}">
        <div>
          <div class="testi-name">${t.name}<small>${t.role}</small></div>
          <div class="testi-stars">${'★'.repeat(t.rating)}${'☆'.repeat(5-t.rating)}</div>
        </div>
      </div>
      <p class="testi-text">"${t.text}"</p>
    </div>
  `).join('');
}
renderTestimonials();

/* ===================== RENDER PRODUCTS ===================== */
const grid = document.getElementById('productGrid');
function renderProducts(cat='all'){
  grid.innerHTML = '';
  const list = cat==='all' ? PRODUCTS : PRODUCTS.filter(p=>p.cat===cat);
  if(!list.length){ grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;">Belum ada produk di kategori ini.</p>'; return; }
  list.forEach(p=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `
      <div class="thumb">
        <img src="${p.img}" alt="${p.title}">
        <span class="cat-badge">${catLabel(p.cat)}</span>
        <button class="quick-add" onclick="event.stopPropagation();addToCart(${p.id})"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div class="info">
        <h3>${p.title}</h3>
        <div class="price">${p.free? 'GRATIS' : fmt(p.price)}</div>
        <button class="btn-detail" onclick="openProductModal(${p.id})">Lihat Detail</button>
      </div>`;
    grid.appendChild(card);
  });
}
function catLabel(c){
  return {ai:'Product',template:'Link',course:'Course',bundle:'Bundling'}[c]||c;
}
renderProducts();

/* Tabs */
document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderProducts(btn.dataset.cat);
});

/* ===================== TOAST ===================== */
function toast(msg, icon='fa-circle-check'){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className='toast';
  t.innerHTML = `<i class="fa-solid ${icon}"></i> ${msg}`;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

/* ===================== CART ===================== */
let cart = [];
function addToCart(id, qty=1){
  const p = PRODUCTS.find(x=>x.id===id);
  const existing = cart.find(x=>x.id===id);
  if(existing){ existing.qty += qty; } else { cart.push({...p, qty}); }
  renderCart();
  toast(`${p.title.slice(0,28)}... ditambahkan ke keranjang`, 'fa-cart-plus');
}
function removeFromCart(id){
  cart = cart.filter(x=>x.id!==id);
  renderCart();
}
function changeQty(id, delta){
  const item = cart.find(x=>x.id===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0){ removeFromCart(id); return; }
  renderCart();
}
function renderCart(){
  const itemsEl = document.getElementById('cartItems');
  const totalEl = document.getElementById('cartTotal');
  const countEl = document.getElementById('cartCount');
  const totalQty = cart.reduce((s,i)=>s+i.qty,0);
  countEl.textContent = totalQty;
  countEl.style.display = totalQty>0 ? 'flex':'none';
  if(cart.length===0){
    itemsEl.innerHTML = `<div class="cart-empty"><i class="fa-solid fa-cart-shopping" style="font-size:26px;display:block;margin-bottom:10px;opacity:.5;"></i>Keranjang kamu masih kosong.</div>`;
  } else {
    itemsEl.innerHTML = cart.map(item=>`
      <div class="cart-item">
        <img src="${item.img}" alt="">
        <div class="ci-info">
          <h4>${item.title}</h4>
          <div class="ci-price">${item.free? 'Gratis' : fmt(item.price)}</div>
          <div class="qty-ctrl">
            <button onclick="changeQty(${item.id},-1)"><i class="fa-solid fa-minus"></i></button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${item.id},1)"><i class="fa-solid fa-plus"></i></button>
          </div>
        </div>
        <button class="remove-item" onclick="removeFromCart(${item.id})"><i class="fa-solid fa-trash"></i></button>
      </div>
    `).join('');
  }
  const total = cart.reduce((s,i)=> s + (i.price*i.qty), 0);
  totalEl.textContent = fmt(total);
}
renderCart();

document.getElementById('checkoutBtn').addEventListener('click', ()=>{
  if(cart.length===0){ toast('Keranjang masih kosong','fa-triangle-exclamation'); return; }
  toast('Mengarahkan ke WhatsApp untuk checkout...', 'fa-whatsapp');
  const text = encodeURIComponent('Halo, saya mau order:\n' + cart.map(i=>`- ${i.title} x${i.qty}`).join('\n'));
  setTimeout(()=> window.open(`https://wa.me/6282125017327?text=${text}`, '_blank'), 900);
});

/* ===================== MODALS / DRAWERS ===================== */
const overlay = document.getElementById('overlay');
const sideMenu = document.getElementById('sideMenu');
const cartDrawer = document.getElementById('cartDrawer');
const productModal = document.getElementById('productModal');
const searchModal = document.getElementById('searchModal');
const reportModal = document.getElementById('reportModal');

function showOverlay(){ overlay.classList.add('show'); }
function hideOverlay(){ overlay.classList.remove('show'); }

function closeAllPanels(){
  sideMenu.classList.remove('show');
  cartDrawer.classList.remove('show');
  productModal.classList.remove('show');
  searchModal.classList.remove('show');
  reportModal.classList.remove('show');
  hideOverlay();
}
overlay.addEventListener('click', closeAllPanels);

/* Side menu */
document.getElementById('menuBtn').addEventListener('click', ()=>{ closeAllPanels(); sideMenu.classList.add('show'); showOverlay(); });
document.getElementById('closeMenu').addEventListener('click', closeAllPanels);

/* Cart drawer */
document.getElementById('cartBtn').addEventListener('click', ()=>{ closeAllPanels(); cartDrawer.classList.add('show'); showOverlay(); });
document.getElementById('closeCart').addEventListener('click', closeAllPanels);

/* Search modal */
document.getElementById('searchBtn').addEventListener('click', ()=>{
  closeAllPanels(); searchModal.classList.add('show'); showOverlay();
  document.getElementById('searchInput').value='';
  renderSearch('');
  setTimeout(()=>document.getElementById('searchInput').focus(),200);
});
document.getElementById('closeSearch').addEventListener('click', closeAllPanels);
document.getElementById('searchInput').addEventListener('input', e=> renderSearch(e.target.value));
function renderSearch(q){
  const res = document.getElementById('searchResults');
  q = q.trim().toLowerCase();
  const list = q ? PRODUCTS.filter(p=>p.title.toLowerCase().includes(q)) : PRODUCTS;
  if(list.length===0){ res.innerHTML = '<div class="no-result">Tidak ditemukan produk yang cocok.</div>'; return; }
  res.innerHTML = list.map(p=>`
    <div class="search-item" onclick="closeAllPanels();openProductModal(${p.id})">
      <img src="${p.img}" alt="">
      <div>
        <h4>${p.title}</h4>
        <span>${p.free? 'Gratis' : fmt(p.price)}</span>
      </div>
    </div>
  `).join('');
}

/* Product modal */
function openProductModal(id){
  const p = PRODUCTS.find(x=>x.id===id);
  document.getElementById('productModalBox').innerHTML = `
    <button class="icon-btn modal-close" onclick="closeAllPanels()"><i class="fa-solid fa-xmark"></i></button>
    <img class="modal-img" src="${p.img}" alt="${p.title}">
    <div class="modal-body">
      <span class="modal-cat">${catLabel(p.cat)}</span>
      <h2>${p.title}</h2>
      <p class="desc">${p.desc}</p>
      <div class="modal-price">${p.free? 'GRATIS' : fmt(p.price)}</div>
      <div class="modal-actions">
        <button class="btn-outline" onclick="addToCart(${p.id});"><i class="fa-solid fa-cart-plus"></i> Keranjang</button>
        <button class="btn-solid" onclick="buyNow(${p.id})"><i class="fa-brands fa-whatsapp"></i> Beli Sekarang</button>
      </div>
    </div>
  `;
  closeAllPanels();
  productModal.classList.add('show');
  showOverlay();
}
function buyNow(id){
  const p = PRODUCTS.find(x=>x.id===id);
  toast('Mengarahkan ke WhatsApp...', 'fa-whatsapp');
  const text = encodeURIComponent(`Halo, saya mau beli produk: ${p.title} (${p.free?'Gratis':fmt(p.price)})`);
  setTimeout(()=> window.open(`https://wa.me/6282125017327?text=${text}`, '_blank'), 800);
}

/* Report modal */
function openReport(){ closeAllPanels(); reportModal.classList.add('show'); showOverlay(); }
document.getElementById('reportBtn').addEventListener('click', openReport);
document.getElementById('closeReport').addEventListener('click', closeAllPanels);
document.getElementById('reportForm').addEventListener('submit', e=>{
  e.preventDefault();
  closeAllPanels();
  toast('Laporan berhasil dikirim, terima kasih!', 'fa-paper-plane');
  e.target.reset();
});

/* Generic CTA link handler */
function openLink(url, label){
  if(url && url.startsWith('http')){
    toast(`Membuka ${label}...`, 'fa-arrow-up-right-from-square');
    setTimeout(()=> window.open(url,'_blank'), 500);
  } else {
    toast(`Link "${label}" bisa kamu ganti dengan link produk / promo kamu sendiri.`, 'fa-link');
  }
}

function scrollToProducts(){
  closeAllPanels();
  document.getElementById('tabs').scrollIntoView({behavior:'smooth', block:'center'});
}

/* Close modals with ESC */
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAllPanels(); });
</script>
</body>
</html>
